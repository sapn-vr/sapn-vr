<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Postulación - Los Santos Police Department</title>
    <link rel="icon" href="icono.ico" type="image/x-icon">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            color: #333;
        }

        header {
            background: url('postu.png') no-repeat center bottom;
            background-size: 100% auto;
	    background-position: top left;
            color: white;
            padding: 20px;
            text-align: center;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        nav {
            color: white;
            padding: 20px;
            text-align: right;
            position: absolute;
            top: 0;
            right: 0;
        }

        nav a {
            font-size: 0.9em;
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }

        nav a:hover {
            color: #8a8a8a;
        }

        .container {
            max-width: 800px;
            margin: 100px auto 20px;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }

        footer {
            background-color: #111;
            color: white;
            text-align: center;
            padding: 10px;
            bottom: 0;
            width: 100%;
        }

        h2 {
            color: #000000;
        }
	h1 {
	    color: #FFFFFF;
	    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
	    font-size: 4em;	
	}

        p {
            margin-bottom: 20px;
        }

        #btn_enviar {
            display: inline-block;
            padding: 10px 20px;
            background-color: #dc0404;
            color: white;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
        }

        #btn_enviar:hover {
            background-color: #df3535;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="email"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <header>
        <h1>Formulario de Postulación</h1>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="servicios.html">Servicios</a>
        <a href="penal.html">Artículo Penal</a>
        <a href="antecedentes.html">Búsqueda y Captura</a>
        <a href="postulacion.html">Postular</a>
    </nav>

    <div class="container">
        <h2>Por favor completa el siguiente formulario:</h2>
        <form id="formulario" onsubmit="enviarFormulario(event)">
            <div class="form-group">
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="edad">Edad:</label>
                <input type="text" id="edad" name="edad" required>
            </div>

            <div class="form-group">
                <label for="genero">Género:</label>
                <select id="genero" name="genero" required>
                    <option value="">Seleccione...</option>
                    <option value="masculino">Masculino</option>
                    <option value="femenino">Femenino</option>
                    <option value="otro">Otro</option>
                </select>
            </div>

            <div class="form-group">
                <label for="experiencia">¿Tienes experiencia previa en la policía?</label>
                <select id="experiencia" name="experiencia" required>
                    <option value="">Seleccione...</option>
                    <option value="si">Sí</option>
                    <option value="no">No</option>
                </select>
            </div>

            <div class="form-group">
                <label for="motivo">Motivo para postular:</label>
                <textarea id="motivo" name="motivo" rows="4" required></textarea>
            </div>

            <div class="form-group">
                <label>¿Qué habilidades posees? (Selecciona todas las que apliquen):</label>
                <input type="checkbox" id="habilidad1" name="habilidades" value="comunicacion">
                <label for="habilidad1">Comunicación</label><br>
                <input type="checkbox" id="habilidad2" name="habilidades" value="liderazgo">
                <label for="habilidad2">Liderazgo</label><br>
                <input type="checkbox" id="habilidad3" name="habilidades" value="trabajo_en_equipo">
                <label for="habilidad3">Trabajo en equipo</label><br>
                <input type="checkbox" id="habilidad4" name="habilidades" value="analisis">
                <label for="habilidad4">Análisis</label>
            </div>

            <div class="form-group">
                <label>¿Cuál es tu nivel de educación?</label>
                <select id="educacion" name="educacion" required>
                    <option value="">Seleccione...</option>
                    <option value="secundaria">Secundaria</option>
                    <option value="preparatoria">Preparatoria</option>
                    <option value="universidad">Universidad</option>
                    <option value="postgrado">Postgrado</option>
                </select>
            </div>

            <div class="form-group">
                <label for="referencia">Referencia (nombre y contacto):</label>
                <input type="text" id="referencia" name="referencia" required>
            </div>

            <div class="form-group">
                <label for="comentarios">Comentarios adicionales:</label>
                <textarea id="comentarios" name="comentarios" rows="4"></textarea>
            </div>

            <button type="submit" id="btn_enviar">Enviar</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2024 Los Santos Police Departament</p>
    </footer>

    <script>
        function enviarFormulario(event) {
            event.preventDefault(); // Evitar el envío del formulario por defecto

            const formData = new FormData(document.getElementById('formulario'));
            const data = {};

            formData.forEach((value, key) => {
                if (data[key]) {
                    if (!Array.isArray(data[key])) {
                        data[key] = [data[key]];
                    }
                    data[key].push(value);
                } else {
                    data[key] = value;
                }
            });

            const embedMessage = {
                embeds: [{
                    color: 0x00FF00, // Color verde
                    title: "📋 Nueva Postulación Recibida",
                    description: "Detalles de la postulación:",
                    fields: [
                        { name: "Nombre Completo", value: data.nombre, inline: true },
                        { name: "Correo Electrónico", value: data.email, inline: true },
                        { name: "Edad", value: data.edad, inline: true },
                        { name: "Género", value: data.genero, inline: true },
                        { name: "Experiencia Previa", value: data.experiencia, inline: true },
                        { name: "Motivo para Postular", value: data.motivo, inline: false },
                        { name: "Habilidades", value: data.habilidades ? data.habilidades.join(", ") : "Ninguna", inline: false },
                        { name: "Nivel de Educación", value: data.educacion, inline: true },
                        { name: "Referencia", value: data.referencia, inline: false },
                        { name: "Comentarios Adicionales", value: data.comentarios || "Ninguno", inline: false }
                    ],
                    footer: {
                        text: "Formulario enviado",
                    },
                    timestamp: new Date().toISOString() // Añadiendo el timestamp
                }]
            };

            fetch('YOUR_WEBHOOK_URL', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(embedMessage)
            })
            .then(response => {
                if (response.ok) {
                    alert('Formulario enviado con éxito.');
                    document.getElementById('formulario').reset(); // Resetear el formulario
                } else {
                    console.error('Error en la respuesta:', response);
                    alert('Error al enviar el formulario.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error al enviar el formulario.');
            });
        }
    </script>
</body>

</html>
